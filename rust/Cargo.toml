[package]
name = "syncnet"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "P2P sync library without a central server (Ed25519 identity, SAS pairing, TLS 1.3, QUIC/LAN/signal transport, signed bundles)"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.16"
